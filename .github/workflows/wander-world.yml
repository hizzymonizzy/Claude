# Wander World only. Runs the same gate as wander-world/tools/check.sh on every push and pull request: engine tests, app build with
# dependency verification, lint, and the privacy & security policy (tools/policy/*.txt).
name: wander-world
on:
  push:
    paths: ["wander-world/**", ".github/workflows/wander-world.yml"]
  pull_request:
    paths: ["wander-world/**", ".github/workflows/wander-world.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wander-world
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        # The runner's preinstalled sdkmanager may be too old to know the newest platform, so update it first.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "cmdline-tools;latest" > /dev/null
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Gate
        run: tools/check.sh
      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: wander-world/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
